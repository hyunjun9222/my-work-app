# Fly.io 배포 설정 — 포털(app.py)을 영구 볼륨과 함께 올린다.
#
# 배포 순서(flyctl 설치 후):
#   1) fly launch --no-deploy      # 이 파일을 인식. app 이름(전역 고유)·리전 확인
#   2) fly volumes create data --region nrt --size 1
#   3) fly secrets set OPENAI_API_KEY=... KOSIS_API_KEY=...   # AI 기능 쓸 때만
#   4) fly deploy
#   5) fly logs                     # 관리자 임시 비밀번호가 한 번 찍힌다
#   → https://<app>.fly.dev

app = "training-portal"      # ⚠ 전역에서 고유해야 함. 이미 있으면 다른 이름으로 바꾸세요.
primary_region = "nrt"       # 도쿄(한국에서 가까움)

[build]

[env]
  PORT = "8080"
  DATA_DIR = "/data"         # 아래 볼륨 마운트 경로 = storage 가 쓰는 곳(제출·계정 보존)

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "data"            # `fly volumes create data` 로 만든 볼륨 이름
  destination = "/data"
